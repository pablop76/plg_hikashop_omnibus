PLG_HIKASHOP_OMNIBUS_ADJUST_DISCOUNT_LABEL="Dopasuj rabat HikaShopa"
PLG_HIKASHOP_OMNIBUS_ADJUST_DISCOUNT_DESC="Dotyczy tego, co HikaShop pokazuje przy cenie z rabatem (opcja HikaShopa „Wyświetl zniżkę”). Tak: wtyczka liczy procent albo kwotę obniżki od najniższej ceny z 30 dni przed obniżką, a nie od ceny regularnej, i ukrywa przekreśloną cenę regularną, bo cenę odniesienia pokazuje napis wtyczki. Gdy obecna cena nie jest niższa od tej najniższej, procent znika. Tak wymaga UOKiK. Nie: HikaShop pokazuje rabat po swojemu, od ceny regularnej. Cena, którą płaci klient, w obu przypadkach jest taka sama."
PLG_HIKASHOP_OMNIBUS_REGULAR_PRICE_LABEL="Cena regularna"
PLG_HIKASHOP_OMNIBUS_SHOW_REGULAR_LABEL="Pokaż cenę regularną"
PLG_HIKASHOP_OMNIBUS_SHOW_REGULAR_DESC="Tak: nad najniższą ceną z 30 dni przed obniżką wtyczka pokazuje cenę regularną z opisem „Cena regularna”, w tym samym wyglądzie co najniższą cenę (czcionka, kolor, przekreślenie). Tak pozwalają wyjaśnienia UOKiK: trzecia cena musi być podpisana i pokazana tak samo jak najniższa, a procent rabatu nadal liczy się od najniższej ceny. Przy cenie wprowadzającej (rabat od pierwszego dnia sprzedaży) ceny regularnej nie ma. Nie: wtyczka pokazuje tylko najniższą cenę."
