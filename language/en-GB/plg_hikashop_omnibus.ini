PLG_HIKASHOP_OMNIBUS_ADJUST_DISCOUNT_LABEL="Adjust HikaShop discount"
PLG_HIKASHOP_OMNIBUS_ADJUST_DISCOUNT_DESC="Affects what HikaShop shows next to a discounted price (HikaShop option “Display discount”). Yes: the plugin calculates the discount percentage or amount from the lowest price of the 30 days before the reduction, not from the regular price, and hides the crossed-out regular price, because the plugin note shows the reference price. When the current price is not lower than that lowest price, the percentage is hidden. This is what the Polish consumer authority (UOKiK) requires. No: HikaShop shows the discount its own way, from the regular price. The price the customer pays is the same either way."
